<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
<style>
  .rig{animation:travel 6s ease-in-out infinite alternate}
  @keyframes travel{from{transform:translateX(-50px)}to{transform:translateX(30px)}}
  .sparks{animation:crackle .16s steps(2,end) infinite}
  @keyframes crackle{50%{opacity:.45}}
  .flame{transform-box:fill-box;transform-origin:50% 0;animation:flicker .12s ease-in-out infinite alternate}
  @keyframes flicker{to{transform:scaleY(1.18)}}
  .glow{transform-box:fill-box;transform-origin:50% 50%;animation:pulse .3s ease-in-out infinite alternate}
  @keyframes pulse{to{transform:scale(1.12);opacity:.7}}
  @media (prefers-reduced-motion: reduce){.rig,.sparks,.flame,.glow{animation:none}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23272c"/><stop offset="1" stop-color="#121417"/></linearGradient>
  <radialGradient id="glow" cx="610" cy="428" r="380" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff6a1a" stop-opacity=".35"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/></radialGradient>
  <radialGradient id="hot" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffbe6"/><stop offset=".3" stop-color="#ffd36a"/><stop offset=".65" stop-color="#ff6a1a" stop-opacity=".5"/><stop offset="1" stop-color="#ff4d0d" stop-opacity="0"/></radialGradient>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a3a"/><stop offset="1" stop-color="#b8501a"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3e7eb"/><stop offset=".5" stop-color="#9aa2ab"/><stop offset="1" stop-color="#4a5058"/></linearGradient>
  <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6e4b10"/><stop offset=".4" stop-color="#f3d27a"/><stop offset="1" stop-color="#7a5514"/></linearGradient>
  <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a3416"/><stop offset=".4" stop-color="#f0a070"/><stop offset="1" stop-color="#8a3c18"/></linearGradient>
  <linearGradient id="kerf" x1="300" y1="0" x2="610" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3a0d05" stop-opacity="0"/><stop offset=".6" stop-color="#9c2a08"/><stop offset="1" stop-color="#fff1b0"/></linearGradient>
</defs>
<rect width="800" height="550" fill="url(#bg)"/>
<rect width="800" height="550" fill="url(#glow)"/>
<!-- plate -->
<rect x="0" y="418" width="800" height="24" fill="#3e434a"/>
<rect x="0" y="442" width="800" height="108" fill="#1f2226"/>
<path d="M0 418H800M0 442H800" stroke="#6b737c" stroke-width="1.5"/>
<path class="rig" d="M300 433 L610 430" stroke="url(#kerf)" stroke-width="5" stroke-linecap="round"/>
<!-- track -->
<rect x="40" y="392" width="470" height="26" rx="3" fill="url(#steel)"/>
<path d="M40 391 H510" stroke="#5a6068" stroke-width="6" stroke-dasharray="5 5"/>
<!-- moving rig: carriage, arm, torch, flame and sparks travel together along the track -->
<g class="rig">
<!-- hoses -->
<g fill="none" stroke-linecap="round" stroke-width="7">
  <path d="M606 222 C606 140 430 120 300 210" stroke="#c9302a"/>
  <path d="M616 222 C620 128 420 100 280 210" stroke="#2b5bc4"/>
</g>
<!-- carriage -->
<circle cx="170" cy="396" r="17" fill="#1b1e22" stroke="#5a6068" stroke-width="4"/>
<circle cx="330" cy="396" r="17" fill="#1b1e22" stroke="#5a6068" stroke-width="4"/>
<rect x="190" y="210" width="130" height="44" rx="10" fill="url(#steel)"/>
<rect x="120" y="248" width="250" height="140" rx="12" fill="url(#body)"/>
<rect x="120" y="248" width="250" height="10" rx="5" fill="#fff" opacity=".18"/>
<rect x="146" y="278" width="128" height="78" rx="6" fill="#1b1e22"/>
<circle cx="178" cy="317" r="18" fill="#2b2f35" stroke="#8b939c" stroke-width="3"/>
<path d="M178 317 L188 304" stroke="#ff6a1a" stroke-width="3" stroke-linecap="round"/>
<rect x="212" y="296" width="14" height="24" rx="3" fill="#8b939c"/>
<circle cx="250" cy="300" r="6" fill="#2ecc71"/>
<circle cx="250" cy="324" r="6" fill="#d33a2c"/>
<rect x="290" y="282" width="56" height="70" rx="4" fill="#000" opacity=".2"/>
<path d="M296 292H340M296 304H340M296 316H340M296 328H340M296 340H340" stroke="#000" stroke-opacity=".3" stroke-width="3"/>
<!-- arm -->
<rect x="368" y="282" width="252" height="18" rx="4" fill="url(#steel)"/>
<rect x="368" y="306" width="220" height="10" rx="3" fill="url(#steel)" opacity=".8"/>
<rect x="588" y="270" width="44" height="54" rx="6" fill="#2b2f35" stroke="#5a6068" stroke-width="3"/>
<!-- torch -->
<rect x="600" y="218" width="20" height="150" rx="4" fill="url(#brass)"/>
<rect x="596" y="362" width="28" height="12" rx="2" fill="url(#brass)"/>
<path d="M600 374 L620 374 L615 398 L605 398 Z" fill="url(#copper)"/>
<!-- flame & hot spot -->
<ellipse class="glow" cx="610" cy="429" rx="100" ry="30" fill="url(#hot)" opacity=".85"/>
<path class="flame" d="M603 398 Q610 436 617 398 Z" fill="#4aa3ff" opacity=".6"/>
<path class="flame" d="M606 398 Q610 416 614 398 Z" fill="#e8f7ff"/>
<g class="sparks" stroke-linecap="round">
  <g stroke="#ffd36a" stroke-width="2.5"><path d="M614 428 L720 380"/><path d="M616 430 L740 440"/><path d="M614 434 L700 510"/><path d="M610 434 L640 530"/><path d="M606 432 L540 500"/></g>
  <g stroke="#ff8a2a" stroke-width="1.8"><path d="M735 372 L760 362"/><path d="M756 441 L785 442"/><path d="M712 522 L728 536"/><path d="M530 512 L516 526"/><path d="M612 432 L780 500"/></g>
</g>
</g>
</svg>
