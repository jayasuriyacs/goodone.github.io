<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23272c"/><stop offset="1" stop-color="#121417"/></linearGradient>
  <radialGradient id="glow" cx="400" cy="260" r="380" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff6a1a" stop-opacity=".14"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/></radialGradient>
  <linearGradient id="ribB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1d3a80"/><stop offset=".35" stop-color="#6f9cf0"/><stop offset=".6" stop-color="#2b5bc4"/><stop offset="1" stop-color="#1d3a80"/></linearGradient>
  <linearGradient id="ribW" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b939c"/><stop offset=".35" stop-color="#ffffff"/><stop offset=".6" stop-color="#d5dade"/><stop offset="1" stop-color="#8b939c"/></linearGradient>
  <pattern id="blue" width="40" height="10" patternUnits="userSpaceOnUse"><rect width="40" height="10" fill="url(#ribB)"/></pattern>
  <pattern id="white" width="40" height="10" patternUnits="userSpaceOnUse"><rect width="40" height="10" fill="url(#ribW)"/></pattern>
  <g id="screws" fill="#e3e7eb" stroke="#4a5058" stroke-width="1.5">
    <circle cx="20" cy="22" r="4"/><circle cx="100" cy="22" r="4"/><circle cx="180" cy="22" r="4"/><circle cx="260" cy="22" r="4"/><circle cx="340" cy="22" r="4"/><circle cx="420" cy="22" r="4"/><circle cx="500" cy="22" r="4"/>
  </g>
</defs>
<rect width="800" height="550" fill="url(#bg)"/>
<rect width="800" height="550" fill="url(#glow)"/>
<!-- purlins -->
<g fill="#3a3f45"><rect x="0" y="182" width="800" height="14"/><rect x="0" y="312" width="800" height="14"/><rect x="0" y="442" width="800" height="14"/></g>
<!-- sheets -->
<g transform="translate(150 70) skewX(-24)">
  <rect width="560" height="150" fill="url(#white)"/>
  <use href="#screws" transform="translate(0 100)"/>
</g>
<g transform="translate(150 180) skewX(-24)">
  <rect x="0" y="-6" width="560" height="10" fill="#000" opacity=".35"/>
  <rect width="560" height="150" fill="url(#blue)"/>
  <use href="#screws" transform="translate(0 100)"/>
</g>
<g transform="translate(150 310) skewX(-24)">
  <rect x="0" y="-6" width="560" height="10" fill="#000" opacity=".35"/>
  <rect width="560" height="150" fill="url(#white)"/>
  <use href="#screws" transform="translate(0 100)"/>
</g>
<!-- loose sheet being placed -->
<g transform="translate(470 400) rotate(-8) skewX(-24)">
  <rect x="6" y="8" width="300" height="110" fill="#000" opacity=".35"/>
  <rect width="300" height="110" fill="url(#blue)"/>
</g>
</svg>
