<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
<style>
  .airflow{animation:flow 1.6s ease-in infinite}
  @keyframes flow{
    0%{transform:translateX(-30px);opacity:0}
    25%{opacity:.9}
    100%{transform:translateX(40px);opacity:0}
  }
  @media (prefers-reduced-motion: reduce){.airflow{animation:none}}
</style>
<defs>
  <linearGradient id="rib" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#152a5c"/><stop offset=".35" stop-color="#4f7fd8"/><stop offset=".6" stop-color="#244fb0"/><stop offset="1" stop-color="#152a5c"/></linearGradient>
  <pattern id="wall" width="46" height="10" patternUnits="userSpaceOnUse"><rect width="46" height="10" fill="url(#rib)"/></pattern>
  <linearGradient id="shadeWall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></linearGradient>
  <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f3f5"/><stop offset="1" stop-color="#8b939c"/></linearGradient>
  <linearGradient id="slat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#c4cad1"/><stop offset="1" stop-color="#6b737c"/></linearGradient>
</defs>
<rect width="800" height="550" fill="url(#wall)"/>
<rect width="800" height="550" fill="url(#shadeWall)"/>
<!-- louver -->
<rect x="232" y="146" width="356" height="246" rx="6" fill="#000" opacity=".4" transform="translate(10 12)"/>
<rect x="222" y="140" width="356" height="246" rx="6" fill="url(#frame)"/>
<rect x="244" y="162" width="312" height="202" fill="#0b0c0e"/>
<g>
  <path d="M244 166 H556 V184 L244 192 Z" fill="url(#slat)"/>
  <path d="M244 194 H556 V212 L244 220 Z" fill="url(#slat)"/>
  <path d="M244 222 H556 V240 L244 248 Z" fill="url(#slat)"/>
  <path d="M244 250 H556 V268 L244 276 Z" fill="url(#slat)"/>
  <path d="M244 278 H556 V296 L244 304 Z" fill="url(#slat)"/>
  <path d="M244 306 H556 V324 L244 332 Z" fill="url(#slat)"/>
  <path d="M244 334 H556 V352 L244 360 Z" fill="url(#slat)"/>
</g>
<g fill="#5a6068"><circle cx="234" cy="152" r="4"/><circle cx="566" cy="152" r="4"/><circle cx="234" cy="374" r="4"/><circle cx="566" cy="374" r="4"/></g>
<!-- airflow -->
<g class="airflow" fill="none" stroke="#ff8a3a" stroke-width="4" stroke-linecap="round" opacity=".85">
  <path d="M600 200 C650 190 680 210 730 200"/><path d="M720 192 L732 200 L720 208"/>
  <path d="M600 262 C650 252 680 272 730 262"/><path d="M720 254 L732 262 L720 270"/>
  <path d="M600 324 C650 314 680 334 730 324"/><path d="M720 316 L732 324 L720 332"/>
</g>
</svg>
