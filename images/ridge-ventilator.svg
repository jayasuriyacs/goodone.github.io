<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23272c"/><stop offset="1" stop-color="#121417"/></linearGradient>
  <radialGradient id="glow" cx="400" cy="160" r="360" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff6a1a" stop-opacity=".2"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/></radialGradient>
  <linearGradient id="rib" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1d3a80"/><stop offset=".35" stop-color="#6f9cf0"/><stop offset=".6" stop-color="#2b5bc4"/><stop offset="1" stop-color="#1d3a80"/></linearGradient>
  <pattern id="sheet" width="42" height="10" patternUnits="userSpaceOnUse"><rect width="42" height="10" fill="url(#rib)"/></pattern>
  <linearGradient id="near" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient>
  <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f3f5"/><stop offset="1" stop-color="#8b939c"/></linearGradient>
</defs>
<rect width="800" height="550" fill="url(#bg)"/>
<rect width="800" height="550" fill="url(#glow)"/>
