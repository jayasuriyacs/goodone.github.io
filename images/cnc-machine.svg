<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23272c"/><stop offset="1" stop-color="#121417"/></linearGradient>
  <radialGradient id="glow" cx="420" cy="370" r="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff6a1a" stop-opacity=".28"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/></radialGradient>
  <radialGradient id="hot" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffbe6"/><stop offset=".3" stop-color="#ffd36a"/><stop offset=".65" stop-color="#ff6a1a" stop-opacity=".5"/><stop offset="1" stop-color="#ff4d0d" stop-opacity="0"/></radialGradient>
  <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f46"/><stop offset="1" stop-color="#555c64"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a3a"/><stop offset="1" stop-color="#b8501a"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a5058"/><stop offset=".4" stop-color="#e3e7eb"/><stop offset="1" stop-color="#5a6068"/></linearGradient>
  <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a3416"/><stop offset=".4" stop-color="#f0a070"/><stop offset="1" stop-color="#8a3c18"/></linearGradient>
  <g id="head">
    <rect x="-24" y="-12" width="48" height="56" rx="5" fill="#2b2f35" stroke="#5a6068" stroke-width="2"/>
    <rect x="-8" y="44" width="16" height="74" fill="url(#steel)"/>
    <path d="M-8 118 L8 118 L5 134 L-5 134 Z" fill="url(#copper)"/>
    <path d="M-5 134 Q0 160 5 134 Z" fill="#4aa3ff" opacity=".65"/>
  </g>
</defs>
